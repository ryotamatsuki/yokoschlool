name: Gameplay regression

on:
  push:
    branches: [main, gameplay-qa-pass]
  pull_request:

permissions:
  contents: read

jobs:
  simulation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run deterministic gameplay regression
        run: node tests/simulation.cjs
